name: Compilar Anchor y verificar frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registro-solana-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Clonar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Registrar versiones del host
        shell: bash
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Crear Cargo.lock reproducible para toolchain Solana 2.1
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cargo update -p blake3 --precise 1.8.2
          cargo update -p proc-macro-crate --precise 3.2.0
          cargo update -p indexmap --precise 2.11.4
          cargo update -p base64ct --precise 1.7.3
          sed -i 's/^version = 4$/version = 3/' Cargo.lock

      - name: Compilar SBF e IDL con imagen oficial Anchor v0.31.1
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace solanafoundation/anchor:v0.31.1 \
            bash -lc 'set -e; anchor --version; solana --version; cargo build-sbf --manifest-path programa/Cargo.toml; mkdir -p target/idl; anchor idl build -o target/idl/registro.json'
          test -s target/deploy/registro.so
          test -s target/idl/registro.json
          echo "Confirmados binario SBF e IDL real sin modificar claves ni Program ID."
          git diff --exit-code -- Anchor.toml programa/src/lib.rs

      - name: Ejecutar pruebas Rust
        shell: bash
        run: cargo test -p registro --lib

      - name: Sincronizar IDL generado con frontend
        shell: bash
        run: node scripts/sync-idl.mjs

      - name: Instalar dependencias web
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Ejecutar pruebas Node e integrar React
        shell: bash
        run: |
          npm test
          npm run build

      - name: Conservar IDL, binario y salida web verificables
        uses: actions/upload-artifact@v4
        with:
          name: registro-build-${{ github.sha }}
          path: |
            target/idl/registro.json
            target/deploy/registro.so
            app/src/idl.json
            app/dist/
            dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar IDL compilado y lockfile en main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git add app/src/idl.json package-lock.json Cargo.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sincronizar IDL real y dependencias verificadas [skip ci]"
            git push origin HEAD:main
          else
            echo "IDL y dependencias ya sincronizados."
          fi
